<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        background-color: #f2f2f2;
        font-family: "Helvetica";
    }
    .container{
        background-color: white;
        max-width:600px;
        margin:100px auto;
        padding: 20px;
        box-shadow: 0 0 10px rgba(0,0,0,0.2) ;
        border-radius: 10px;

    }
    h1{
        margin-top: 0;
        text-align:center ;

    }
    input{
        padding:10px;
        border:1px solid#ccc;
        border-radius: 4px;
        margin:10px 0;
        width:100%;

    }
    button{
        background-color: #4caf50;
        color:white;
        padding:10px;
        border:none;
        cursor: pointer;
        margin:10px 0;
        width:100%;
        font-size: 18px;
        text-transform: uppercase;
        transition: background-color 0.2s ease;

    }
    button:hover{
        background-color:#45a049;
    }
    #total{
        font-size: 24px;
        font-weight: bold;
        margin-top: 10px;
    }
</style>
<body>
    <div class="container">
        <h1>Tip Calculator</h1>
        <p>Enter the bill amount and tip percentage to calculate total</p>
        <label for="bill">Bill Amount</label>
        <input type="number" id="bill"><br>
        <label for="tip">Tip Percentage</label>
        <input type="number" id="tip"><br>
        <button id="calculate">calculate</button>
        <label for="total">Total:</label>
        <span id="total"></span>
    </div>
    <script>
        const btnEle=document.getElementById("calculate")
        const billInput=document.getElementById("bill")
        const tipInput=document.getElementById("tip")
        const totalspan=document.getElementById("total")
        function calculateTotal(){
            const billvalue=parseFloat(billInput.value);
            const tipvalue=tipInput.value;
            const tipamount=billvalue*(tipvalue/100)
            const finalamount=billvalue+tipamount
            totalspan.innerText=tipamount+billvalue
        }
        btnEle.addEventListener("click",calculateTotal)
    </script>

    
</body>
</html>
